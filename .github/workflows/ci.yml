name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install the repository-pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: python -m pip install -e ".[dev]"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --workspace --locked
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Smoke-test the built wheel outside the checkout
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'smd-twin-wheel-smoke'
          py -3.13 -m venv $smoke
          $python = Join-Path $smoke 'Scripts\python.exe'
          $wheel = Get-ChildItem dist\smd_twin_lab-*.whl | Select-Object -First 1
          & $python -m pip install $wheel.FullName
          Push-Location $env:RUNNER_TEMP
          & $python -c "from importlib.resources import files; root = files('smd_twin_lab'); expected = ('resources/i18n/smd_twin_lab_ru.qm', 'resources/lessons/en/aoi.md', 'resources/lessons/en/faults.md', 'resources/lessons/en/getting_started.md', 'resources/lessons/en/simulation.md', 'resources/lessons/ru/aoi.md', 'resources/lessons/ru/faults.md', 'resources/lessons/ru/getting_started.md', 'resources/lessons/ru/simulation.md'); missing = [path for path in expected if not root.joinpath(*path.split('/')).is_file()]; assert not missing, missing"
          & $python -c "from smd_twin_lab.eda import divider_project, simulate_dc; result = simulate_dc(divider_project()); assert result.success; assert abs(result.voltage('VOUT') - 1.65) < 1e-9"
          & $python -m smd_twin_lab.cli tools
          & $python -m smd_twin_lab.cli demo --engine reference --fault none
          & $python -m smd_twin_lab.cli demo --engine reference --fault thermistor_open
          $env:QT_QPA_PLATFORM = 'offscreen'
          & $python -c "from pathlib import Path; from PySide6 import QtCore; from smd_twin_lab.app import create_application, build_window; from smd_twin_lab.localization import current_language_manager; settings=QtCore.QSettings(str(Path.cwd() / 'wheel-smoke.ini'), QtCore.QSettings.Format.IniFormat); app=create_application([], settings=settings, system_languages=('ru-RU',)); manager=current_language_manager(); window=build_window(language_manager=manager); assert manager.current_language == 'ru'; assert window.file_menu.title() == '\u0424\u0430\u0439\u043b'; assert window.project.name == 'USB Sensor/Status Board'; window.close()"
          Pop-Location
