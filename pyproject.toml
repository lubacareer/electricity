[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smd-twin-lab"
version = "0.1.0"
description = "A local SMD PCB digital-twin and functional-test learning lab"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "PySide6>=6.10,<7",
  "numpy>=2.2,<3",
  "pyqtgraph>=0.13.7,<1",
  "PyYAML>=6.0.2,<7",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "pytest-qt>=4.4,<5",
  "ruff>=0.11,<1",
]

[project.scripts]
smd-twin = "smd_twin_lab.app:main"
smd-twin-cli = "smd_twin_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smd_twin_lab = [
  "resources/**/*.yaml",
  "resources/**/*.json",
  "resources/**/*.svg",
  "resources/**/*.cir",
  "resources/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
